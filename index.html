<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#151a27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dustworks">
  <title>Dustworks</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="world" aria-label="Game world"></canvas>

  <header id="hud">
    <div class="card stats">
      <div class="stat res"><span class="lbl">Stock</span>
        <span class="resrow"><span class="r"><i class="dot d0"></i><span id="res0" class="num">0</span></span><span class="r"><i class="dot d1"></i><span id="res1" class="num">0</span></span><span class="r"><i class="dot d2"></i><span id="res2" class="num">0</span></span><span class="r"><i class="dot d3"></i><span id="res3" class="num">0</span></span></span>
        <span id="rate" class="sub">0/min</span></div>
      <div class="stat pack"><span class="lbl" id="packLbl">Backpack</span><span class="bar"><i id="packBar"></i></span><span id="packText" class="num sm">0/30</span></div>
      <div class="stat clean"><span class="lbl">Clean</span><span class="bar"><i id="cleanBar"></i></span><span id="cleanPct" class="num sm">0%</span></div>
      <div class="stat vents"><span class="lbl">Vents</span><span id="ventCount" class="num">0/6</span></div>
    </div>
    <button id="taskChip" class="card task" type="button" aria-label="Tasks"><span class="lbl">Task</span><span id="taskText">…</span><span class="bar small"><i id="taskBar"></i></span></button>
    <div class="hud-right">
      <button id="speedBtn" class="hbtn" type="button" title="Game speed">1×</button>
      <button id="shopBtn" class="hbtn accent" type="button">Build</button>
      <button id="menuBtn" class="hbtn" type="button">Menu</button>
    </div>
  </header>

  <aside id="panel" hidden>
    <div class="panel-head"><h2 id="panelTitle">Panel</h2><button id="panelClose" class="x" type="button" aria-label="Close">✕</button></div>
    <div id="panelBody"></div>
  </aside>

  <nav id="toolbar" aria-label="Tools">
    <button data-tool="walk" type="button" aria-label="Walk"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="2.5"/><path d="M12 8v6m0 0l-3 6m3-6l3 6M8 11h8"/></svg><b>Walk</b></button>
    <button data-tool="zone" type="button" aria-label="Zones"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1" stroke-dasharray="3 2.4"/><path d="M9 15l3-7 3 7m-5-2h4"/></svg><b>Zones</b></button>
    <button data-tool="belt" type="button" aria-label="Belt"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"/><path d="M8 10l2 2-2 2m5-4l2 2-2 2"/></svg><b>Belt</b></button>
    <button data-tool="splitter" type="button" aria-label="Splitter"><svg viewBox="0 0 24 24"><path d="M4 12h8m0 0l6-6m-6 6h8m-8 0l6 6M16 4h2v2M18 10l2 2-2 2M16 20h2v-2"/></svg><b>Splitter</b></button>
    <button id="machBtn" type="button" aria-label="Machines" aria-haspopup="true"><svg viewBox="0 0 24 24"></svg><b>Bin</b><span class="caret">▴</span></button>
    <button data-tool="erase" type="button" aria-label="Remove"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><b>Remove</b></button>
  </nav>
  <div id="palette" hidden role="menu" aria-label="Machines"></div>
  <div id="driveBar" hidden><span id="driveName" class="lbl">Rover</span><button id="parkBtn" class="hbtn" type="button">Park</button><button id="hopBtn" class="hbtn accent" type="button">Hop out</button></div>
  <div id="miniWrap"><canvas id="mini" aria-label="Minimap"></canvas><button id="findMe" class="hbtn" type="button">Find me</button></div>

  <div id="hint" aria-live="polite"></div>
  <div id="toast" aria-live="polite"></div>
  <div id="title" hidden>
    <div class="title-inner">
      <div class="brand"><img src="icons/icon.svg" alt="" width="72" height="72"><div><h1>Dustworks</h1><p>Clean a junk-covered rock by hand, then build the machine that does it for you.</p></div></div>
      <div id="slots"></div>
    </div>
  </div>
  <div id="modal" hidden><div class="modal-card" id="modalCard"></div></div>

  <script src="js/game.js"></script>
</body>
</html>
